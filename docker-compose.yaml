# Standalone: `docker compose up` locally. Never deployed — fine to publish ports here,
# this file is not internet-facing.
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
      TZ: Etc/UTC
    ports:
      - "8191:8191"
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Deliberately no read_only: true — undetected_chromedriver writes to
    # /app/.local and Chrome itself needs additional write paths. Same
    # posture as the browser sidecar: write surface too broad to enumerate.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 300
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8191/health -o /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
